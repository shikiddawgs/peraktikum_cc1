<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum Shikid Dawg - Komputasi Awan</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Background Gradasi Biru Laut */
            background: linear-gradient(135deg, #0077b6 0%, #03045e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            color: #ffffff;
        }

        /* Card Utama */
        .splash-card {
            position: relative;
            width: 100%;
            max-width: 920px;
            min-height: 550px;
            background-color: #020813;
            border-radius: 26px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
        }

        /* Panel Gambar Kanan */
        .art-panel {
            position: absolute;
            top: 0;
            right: 0;
            width: 58%;
            height: 100%;
            background-image: url('miko.jpg');
            background-size: cover;
            background-position: right center;
            background-repeat: no-repeat;
            z-index: 1;
            image-rendering: pixelated;
        }

        /* Gradasi Halus Menyatu dengan Panel Hitam-Biru Kiri */
        .art-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                90deg, 
                #020813 0%, 
                #020813 42%, 
                rgba(2, 8, 19, 0.85) 48%, 
                rgba(2, 8, 19, 0) 62%
            );
            z-index: 2;
        }

        /* Konten Teks Kiri */
        .content-panel {
            position: relative;
            z-index: 3;
            width: 55%;
            padding: 48px 52px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .title {
            font-size: 54px;
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -0.5px;
            margin-bottom: 32px;
            color: #ffffff;
        }

        /* Warna Biru Laut Menyala untuk kata Praktikum */
        .title .highlight-blue {
            color: #00b4d8;
            display: block;
        }

        .subtitle {
            font-size: 19px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 14px;
        }

        .divider {
            width: 100%;
            max-width: 380px;
            height: 2px;
            background: linear-gradient(90deg, #00b4d8 0%, rgba(0, 180, 216, 0.1) 100%);
            margin-bottom: 18px;
        }

        .copyright {
            font-size: 14.5px;
            line-height: 1.55;
            color: #cbd5e1;
            margin-bottom: 30px;
            max-width: 380px;
        }

        /* Bagian Loading */
        .loading-box {
            margin-bottom: 24px;
        }

        .loading-label {
            font-size: 17px;
            color: #f1f5f9;
            margin-bottom: 10px;
        }

        .loader-bars {
            display: flex;
            gap: 6px;
            padding-left: 3px;
        }

        .bar {
            width: 15px;
            height: 13px;
            background-color: #00b4d8;
            transform: skewX(-25deg);
            border-radius: 1px;
            animation: pulseBar 1.6s infinite ease-in-out;
        }

        .bar:nth-child(1) { animation-delay: 0.0s; }
        .bar:nth-child(2) { animation-delay: 0.2s; }
        .bar:nth-child(3) { animation-delay: 0.4s; }
        .bar:nth-child(4) { animation-delay: 0.6s; }
        .bar:nth-child(5) { animation-delay: 0.8s; background-color: #0077b6; }
        .bar:nth-child(6) { animation-delay: 1.0s; background-color: #023e8a; }
        .bar:nth-child(7) { animation-delay: 1.2s; background-color: #03045e; }

        @keyframes pulseBar {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        /* Info Mahasiswa */
        .student-info {
            border-left: 5px solid #00b4d8;
            padding-left: 16px;
            margin-top: 6px;
        }

        .student-info .name {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .student-info .meta {
            font-size: 17.5px;
            color: #e2e8f0;
            line-height: 1.45;
        }

        .student-info .meta span {
            display: inline-block;
            width: 72px;
        }

        @media (max-width: 768px) {
            .splash-card { flex-direction: column; }
            .art-panel { position: relative; width: 100%; height: 320px; }
            .art-overlay { background: linear-gradient(0deg, #020813 15%, rgba(2, 8, 19, 0) 100%); }
            .content-panel { width: 100%; padding: 32px 24px; }
            .title { font-size: 40px; }
        }
    </style>
</head>
<body>

    <div class="splash-card">
        <div class="art-panel"></div>
        <div class="art-overlay"></div>

        <div class="content-panel">
            <h1 class="title">
                <span class="highlight-blue">Praktikum</span>
                Shikid Dawg
            </h1>

            <div class="middle-section">
                <p class="subtitle">Tugas Praktikum 1 Komputasi Awan</p>
                <div class="divider"></div>
                <p class="copyright">
                    &copy; 2024-2026 Shikid Dawg. All rights reserved.<br>
                    Untuk keperluan praktikum Komputasi Awan.<br>
                    Tidak untuk penggunaan komersial.
                </p>
            </div>

            <div class="loading-box">
                <p class="loading-label">Initializing Shikid Dawg...</p>
                <div class="loader-bars">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
            </div>

            <div class="divider"></div>

            <div class="student-info">
                <p class="name">Anggoro Cipta Widodo</p>
                <p class="meta"><span>Kelas</span>: 24-03</p>
                <p class="meta"><span>NIM</span>: 102042400045</p>
                <p class="meta"><span>Jabatan</span>: Editor Keroco</p>
            </div>
        </div>
    </div>

</body>
</html>
